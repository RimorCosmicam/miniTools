name: Build miniTools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Write the release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          fi

      - name: Build release APK
        env:
          MINITOOLS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          MINITOOLS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MINITOOLS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MINITOOLS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Name the release APK
        run: cp app/build/outputs/apk/release/app-release.apk miniTools.apk
      - uses: actions/upload-artifact@v6
        with:
          name: minitools-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v6
        with:
          name: minitools-apk
          path: miniTools.apk
